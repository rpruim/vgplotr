url: https://rpruim.github.io/vgplotr/

template:
  bootstrap: 5

navbar:
  structure:
    left:  [intro, design, articles, examples, reference]
    right: [search]
  components:
    intro:
      text: Get Started
      href: articles/getting-started.html
    design:
      text: Design Principles
      href: articles/design-principles.html
    articles:
      text: Articles
      menu:
      - text: Getting Started
        href: articles/getting-started.html
      - text: Design Principles
        href: articles/design-principles.html
      - text: Using Databases
        href: articles/using-databases.html
      - text: Custom JavaScript
        href: articles/custom-javascript.html
    examples:
      text: Examples
      menu:
      - text: Mosaic Examples
        href: articles/mosaic-examples.html
      - text: Other Examples
        href: articles/other-examples.html

reference:
- title: Spec functions
  desc: >
    Start and configure a vgspec -- data sources, params/selections,
    metadata, and top-level attributes.
  contents:
  - has_concept("spec functions")

- title: Mark functions
  desc: >
    Add a visual layer (points, lines, bars, ...) to a plot -- one
    `vg_mark_*()` function per mark type Mosaic supports, plus the general
    `vg_mark()`.
  contents:
  - has_concept("mark functions")

- title: Scale functions
  desc: >
    Set the scale (domain/range, type, palette, ...) backing an encoding
    channel -- position, facet, color, opacity, radius, length, symbol.
  contents:
  - has_concept("scale functions")

- title: Guide functions
  desc: >
    Set axis-guide attributes (labels, ticks, grid lines, ...) for a
    scale, without adding a visible legend.
  contents:
  - has_concept("guide functions")

- title: Legend functions
  desc: >
    Add a visible legend -- embedded in a plot, or standalone.
  contents:
  - has_concept("legend functions")

- title: Interactor functions
  desc: >
    Selections that live inside a plot alongside its marks (brushes,
    pan/zoom, highlight, ...), and standalone layout-level input widgets
    (menu, search, slider, table) -- one function per type, plus the
    general `vg_interactor()`.
  contents:
  - has_concept("interactor functions")

- title: Transform functions
  desc: >
    Binning, aggregation, and window functions for use inside a mapping
    formula, plus raw SQL/aggregate expressions.
  contents:
  - has_concept("transform functions")

- title: Layout functions
  desc: >
    Combine plots (and other layout items) into one spec -- side by side,
    stacked, or with plot-level attributes attached.
  contents:
  - has_concept("layout functions")

- title: Rendering functions
  desc: >
    Turn a vgspec into something you can actually look at -- a live
    widget, a static screenshot, or a live `<iframe>` embed -- either
    picked automatically or requested explicitly.
  contents:
  - has_concept("rendering functions")

- title: Spec export functions
  desc: >
    Convert a vgspec to Mosaic's own portable JSON/YAML spec format.
  contents:
  - has_concept("spec export functions")

- title: DuckDB caching functions
  desc: >
    Manage a local cache of duckdb-wasm's database engine, so rendered
    graphics don't need to fetch it from a CDN every time.
  contents:
  - has_concept("duckdb caching functions")

- title: Connector functions
  desc: >
    Choose what database a graphic's SQL actually runs against: the default
    duckdb-wasm in the browser, or a real, native DuckDB reached over a
    local server.
  contents:
  - has_concept("connector functions")

- title: Info functions
  desc: >
    Report which versions of vgplotr's dependencies (Mosaic, DuckDB-Wasm,
    the optional native-DuckDB R packages) are actually in use.
  contents:
  - has_concept("info functions")

- title: Data 
  desc: >
    Datasets used in examples, and which functions each example uses.
  contents:
  - NPSvisits
  - vg_example_usage

- title: Reference
  desc: >
    What the `<option | option | ...>` notation in the argument
    documentation of marks, interactors, scales and guides means.
  contents:
  - vg_value_types

