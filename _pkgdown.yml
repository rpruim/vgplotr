url: https://rpruim.github.io/vgplotr/

template:
  bootstrap: 5

navbar:
  structure:
    left:  [intro, design, examples, reference]
    right: [search]
  components:
    intro:
      text: Get Started
      href: articles/getting-started.html
    design:
      text: Design Principles
      href: articles/design-principles.html
    examples:
      text: Examples
      href: articles/index.html

articles:
- title: Get Started
  contents:
  - getting-started

- title: Design Principles
  contents:
  - design-principles

- title: Basic Marks & Inputs
  desc: >
    Core mark types, encodings, and layout-level input widgets (menus,
    sliders, tables).
  contents:
  - articles/basic-marks-inputs-mark-types
  - articles/basic-marks-inputs-symbol-plots
  - articles/basic-marks-inputs-axes-gridlines
  - articles/basic-marks-inputs-airline-travelers
  - articles/basic-marks-inputs-aeromagnetic-survey
  - articles/basic-marks-inputs-athlete-birth-waffle
  - articles/basic-marks-inputs-driving-shifts
  - articles/basic-marks-inputs-population-arrows
  - articles/basic-marks-inputs-presidential-opinion
  - articles/basic-marks-inputs-voronoi
  - articles/basic-marks-inputs-seattle-temperatures
  - articles/basic-marks-inputs-sorted-bars
  - articles/basic-marks-inputs-table

- title: Data Transformation
  desc: >
    Binning, aggregation, window functions, and SQL expressions computed
    live in the database.
  contents:
  - articles/data-transformation-athlete-height
  - articles/data-transformation-bias
  - articles/data-transformation-linear-regression
  - articles/data-transformation-linear-regression-10m
  - articles/data-transformation-moving-average
